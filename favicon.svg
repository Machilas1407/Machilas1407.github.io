    y="2"
    width="60"
    height="60"
    rx="15"
  />

  <path
    class="mark"
    d="M15 43V21L24 32L32 21V43"
  />
  <circle
    class="mark"
    cx="43"
    cy="31"
    r="10"
  />

  <path
    class="mark"
    d="M48 38L54 44"
  />

  <circle
    class="point"
    cx="43"
    cy="31"
    r="2.7"
  />
</svg>