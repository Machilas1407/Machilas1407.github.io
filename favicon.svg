<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <style>
    .bg {
      fill: #0b0d10;
    }

    .mark {
      fill: none;
      stroke: #eee9df;
      stroke-width: 3.6;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .point {
      fill: #eee9df;
    }

    @media (prefers-color-scheme: light) {
      .bg {
        fill: #eee9df;
      }

      .mark {
        stroke: #0b0d10;
      }

      .point {
        fill: #0b0d10;
      }
    }
  </style>

  <!-- fundo -->
  <rect
    class="bg"
